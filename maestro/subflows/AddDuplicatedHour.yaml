appId: ${appId}
---
# Starting with 09:00 and 10:00, moves 10:00 back to 09:00.
# Tapping the row above the selected one on the hour wheel moves it 1 hour back.
- scrollUntilVisible:
    element: "Hour #2"
    centerElement: true
- tapOn: "10:00"
- tapOn:
    text: "10 o.clock"
    point: "50%,37%"
- assertVisible: "09 o.clock"
# Closes the hour wheel
- tapOn:
    point: 50%,8%
- assertNotVisible: "09 o.clock"
- assertVisible:
    text: "09:00"
    index: 1
