appId: ${appId}
---
# Starting with 09:00 and 10:00, adds 11:00 and 12:00 and moves 12:00 back to 09:00.
# Swiping down on the open hour wheel moves it 3 hours back.
- scrollUntilVisible:
    element: ${output.buttonNewHabitScheduleAdd}
- tapOn: ${output.buttonNewHabitScheduleAdd}
- tapOn: ${output.buttonNewHabitScheduleAdd}
- scrollUntilVisible:
    element: "Hour #4"
    centerElement: true
- tapOn: "12:00"
- swipe:
    from:
      text: "12 o.clock"
    direction: DOWN
    duration: 1500
- assertVisible: "09 o.clock"
# Closes the hour wheel
- tapOn:
    point: 50%,8%
- assertNotVisible: "09 o.clock"
- assertVisible:
    text: "09:00"
    index: 1
