appId: ${appId}
---
# Picks FREQUENCY and fills it with VALUE.
# Daily and weekly share the week days option: daily selects every day, weekly only the day after today
- scrollUntilVisible:
    element:
      id: ${output.idFrequency}
- tapOn:
    id: ${output.idFrequency}
- tapOn: "${FREQUENCY == 'Daily' || FREQUENCY == 'Weekly' ? output.frequencyWeekDays : FREQUENCY}"
- assertVisible: "Frequency, ${FREQUENCY == 'Daily' || FREQUENCY == 'Weekly' ? output.frequencyWeekDays : FREQUENCY}"

- runFlow:
    when:
      true: ${FREQUENCY == 'Daily'}
    file: SelectAllWeekDays.yaml
- runFlow:
    when:
      true: ${FREQUENCY == 'Weekly'}
    file: SelectOnlyTomorrow.yaml

- runFlow:
    when:
      true: ${FREQUENCY == 'Interval'}
    commands:
      - scrollUntilVisible:
          element:
            id: ${output.idInterval}
      - runFlow:
          file: TypeNumber.yaml
          env:
            FIELD_ID: ${output.idInterval}

- runFlow:
    when:
      true: ${FREQUENCY == 'Minimum Days'}
    commands:
      - scrollUntilVisible:
          element:
            id: ${output.idMinDays}
      - runFlow:
          file: TypeNumber.yaml
          env:
            FIELD_ID: ${output.idMinDays}

- runFlow:
    when:
      true: ${FREQUENCY == 'Minimum Times'}
    commands:
      - scrollUntilVisible:
          element:
            id: ${output.idMinTimes}
      - runFlow:
          file: TypeNumber.yaml
          env:
            FIELD_ID: ${output.idMinTimes}
