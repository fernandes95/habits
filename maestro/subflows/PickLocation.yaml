appId: ${appId}
---
# Drops a pin in the middle of the map and turns the location reminder on
- tapOn:
    id: ${output.idNewHabitLocation}
- assertVisible:
    id: ${output.idLocationPickerDone}
- tapOn:
    point: 50%,45%
- tapOn:
    id: ${output.idLocationPickerDone}
- assertVisible:
    id: ${output.idLocationCard}
# The reminder row moves down while the card animates in
- waitForAnimationToEnd

- tapOn:
    text: "0"
    childOf:
      id: ${output.idNewHabitLocationReminder}
# Notifications are only asked the first time, and Maestro may already have allowed them
- runFlow:
    when:
      visible: ".*Would Like to Send You Notifications"
    commands:
      - tapOn:
          text: "Allow"
          optional: true
- assertVisible:
    text: "1"
    childOf:
      id: ${output.idNewHabitLocationReminder}
