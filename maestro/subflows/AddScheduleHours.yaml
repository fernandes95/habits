appId: ${appId}
---
# Turns the reminder on, which adds 09:00, and adds 10:00
- scrollUntilVisible:
    element:
      id: "habit_reminder"
- tapOn:
    id: "habit_reminder"
- scrollUntilVisible:
    element: ${output.buttonNewHabitScheduleAdd}
- tapOn: ${output.buttonNewHabitScheduleAdd}
- scrollUntilVisible:
    element: "Hour #2"
- assertVisible: "09:00"
- assertVisible: "10:00"
