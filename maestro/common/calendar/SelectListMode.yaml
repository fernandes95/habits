appId: ${appId}
---
- runFlow:
    env:
      containerId: "ListViewContainerView"
    when:
      visible: 
        id: "ListViewContainerView"
    file: SelectContainerBack.yaml

- runFlow:
    env:
      containerId: "MultiDayWeekViewContainerView"
    when:
      visible: 
        id: "MultiDayWeekViewContainerView"
    file: SelectContainerBack.yaml

- runFlow:
    env:
      containerId: "DayViewContainerView"
    when:
      visible: 
        id: "DayViewContainerView"
    file: SelectContainerBack.yaml

# Select List View option
- tapOn:
    id: "toggle-month-view"
- assertVisible: "List"
- tapOn: "List"