appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# A valid minimum days habit with schedule, end date and location
# can't be added once it has an empty name
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetForever.yaml
- runFlow: ../subflows/PickLocation.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Minimum Days
      VALUE: "3"
- runFlow: ../subflows/AddScheduleHours.yaml
- runFlow: ../subflows/AssertAddEnabled.yaml

- runFlow: ../subflows/ClearName.yaml
- pressKey: Enter

- runFlow: ../subflows/AssertAddDisabled.yaml
