appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# A valid minimum times habit with schedule, end date and location
# can't be added once it has 101 minimum times
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetForever.yaml
- runFlow: ../subflows/PickLocation.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Minimum Times
      VALUE: "5"
- runFlow: ../subflows/AddScheduleHours.yaml
- runFlow: ../subflows/AssertAddEnabled.yaml

- scrollUntilVisible:
    element:
      id: ${output.idGoalValue}
    direction: UP
- runFlow:
    file: ../subflows/TypeNumber.yaml
    env:
      FIELD_ID: ${output.idGoalValue}
      VALUE: "101"

- runFlow: ../subflows/AssertAddDisabled.yaml
