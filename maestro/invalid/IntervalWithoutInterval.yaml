appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# A valid interval habit with schedule, end date and location
# can't be added once it has no interval
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetEndDate.yaml
- runFlow: ../subflows/PickLocation.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Interval
      VALUE: "3"
- runFlow: ../subflows/AddScheduleHours.yaml
- runFlow: ../subflows/AssertAddEnabled.yaml

- scrollUntilVisible:
    element:
      id: ${output.idInterval}
    direction: UP
- runFlow:
    file: ../subflows/TypeNumber.yaml
    env:
      FIELD_ID: ${output.idInterval}
      VALUE: ""

- runFlow: ../subflows/AssertAddDisabled.yaml
