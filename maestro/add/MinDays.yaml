appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# Adds a minimum days habit, forever, without schedule or location
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetForever.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Minimum Days
      VALUE: "3"
- runFlow: ../subflows/AddHabit.yaml
- runFlow:
    file: ../subflows/AssertSavedSettings.yaml
    env:
      FREQUENCY: Minimum Days
      VALUE: "3"
      HAS_SCHEDULE: false
      HAS_END_DATE: false
      HAS_LOCATION: false
      WEEK_DAYS: one
