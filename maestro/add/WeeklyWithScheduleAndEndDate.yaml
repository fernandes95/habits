appId: ${appId}
# The end date can't be set for now, excluded in config.yaml
tags:
  - endDate
onFlowStart:
  - runFlow: ../env.yaml
---
# Adds a weekly habit, with two schedule hours, with an end date
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetEndDate.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Weekly
      VALUE: ""
- runFlow: ../subflows/AddScheduleHours.yaml
- runFlow: ../subflows/AddHabit.yaml
- runFlow:
    file: ../subflows/AssertSavedSettings.yaml
    env:
      FREQUENCY: Weekly
      VALUE: ""
      HAS_SCHEDULE: true
      HAS_END_DATE: true
      HAS_LOCATION: false
