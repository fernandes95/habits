appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# Adds a daily habit, with two schedule hours, with an end date
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Daily
      VALUE: ""
- runFlow: ../subflows/AddScheduleHours.yaml
- runFlow: ../subflows/AddHabit.yaml
- runFlow:
    file: ../subflows/AssertSavedSettings.yaml
    env:
      FREQUENCY: Daily
      VALUE: ""
      HAS_SCHEDULE: true
      HAS_END_DATE: true
      HAS_LOCATION: false
