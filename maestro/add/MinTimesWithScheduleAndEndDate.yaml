appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# Adds a minimum times habit, with two schedule hours, with an end date
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Minimum Times
      VALUE: "5"
- runFlow: ../subflows/AddScheduleHours.yaml
- runFlow: ../subflows/AddHabit.yaml
- runFlow:
    file: ../subflows/AssertSavedSettings.yaml
    env:
      FREQUENCY: Minimum Times
      VALUE: "5"
      HAS_SCHEDULE: true
      HAS_END_DATE: true
      HAS_LOCATION: false
      WEEK_DAYS: one
