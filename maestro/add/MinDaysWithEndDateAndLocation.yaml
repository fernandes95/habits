appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# Adds a minimum days habit, with an end date, with a location reminder
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetEndDate.yaml
- runFlow: ../subflows/PickLocation.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Minimum Days
      VALUE: "3"
- runFlow: ../subflows/AddHabit.yaml
- runFlow:
    file: ../subflows/AssertSavedSettings.yaml
    env:
      FREQUENCY: Minimum Days
      VALUE: "3"
      HAS_SCHEDULE: false
      HAS_END_DATE: true
      HAS_LOCATION: true
      WEEK_DAYS: one
