appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# Adds an interval habit with the lowest interval, 3 days
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetForever.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Interval
      VALUE: "3"
- runFlow: ../subflows/AddHabit.yaml
- runFlow:
    file: ../subflows/AssertSavedSettings.yaml
    env:
      FREQUENCY: Interval
      VALUE: "3"
      HAS_SCHEDULE: false
      HAS_END_DATE: false
      HAS_LOCATION: false
      WEEK_DAYS: one
