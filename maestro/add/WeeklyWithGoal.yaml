appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# Adds a weekly habit with a goal of 5 times a day, the goal doesn't change the picked week day
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetForever.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Weekly
      VALUE: ""
- runFlow:
    file: ../subflows/SetGoal.yaml
    env:
      ON: true
- scrollUntilVisible:
    element:
      id: ${output.idGoalValue}
- runFlow:
    file: ../subflows/TypeNumber.yaml
    env:
      FIELD_ID: ${output.idGoalValue}
      VALUE: "5"
- runFlow: ../subflows/AddHabit.yaml
- runFlow:
    file: ../subflows/AssertSavedSettings.yaml
    env:
      FREQUENCY: Weekly
      VALUE: ""
      HAS_SCHEDULE: false
      HAS_END_DATE: false
      HAS_LOCATION: false
- scrollUntilVisible:
    element:
      id: ${output.idGoalValue}
- assertVisible:
    id: ${output.idGoalValue}
    text: "5"
