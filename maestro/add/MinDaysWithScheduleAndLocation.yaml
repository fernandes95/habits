appId: ${appId}
onFlowStart:
  - runFlow: ../env.yaml
---
# Adds a minimum days habit, with two schedule hours, with a location reminder, forever
- runFlow: ../subflows/OpenNewHabit.yaml
- runFlow: ../subflows/SetForever.yaml
- runFlow: ../subflows/PickLocation.yaml
- runFlow:
    file: ../subflows/SelectFrequency.yaml
    env:
      FREQUENCY: Minimum Days
      VALUE: "3"
- runFlow: ../subflows/AddScheduleHours.yaml
- runFlow: ../subflows/AddHabit.yaml
- runFlow:
    file: ../subflows/AssertSavedSettings.yaml
    env:
      FREQUENCY: Minimum Days
      VALUE: "3"
      HAS_SCHEDULE: true
      HAS_END_DATE: false
      HAS_LOCATION: true
      WEEK_DAYS: one
